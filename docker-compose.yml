services:
  db:
    image: postgres:16-alpine
    container_name: costumehub_db
    restart: always
    environment:
      POSTGRES_DB: costumehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: costumehub_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      SESSION_SECRET: costumehub_secret
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: costumehub
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "3000:3000"
    volumes:
      # Giữ file upload khi xóa / build lại container
      - uploads:/app/public/uploads          # ảnh trang phục (công khai)
      - private_uploads:/app/private_uploads # ảnh CCCD (riêng tư)

volumes:
  pgdata:
  uploads:
  private_uploads:
