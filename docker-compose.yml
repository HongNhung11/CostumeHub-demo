# Chạy:  bấm đúp CHAY_WEB.cmd (Windows) · sh chay-web.sh (macOS / Linux) · hoặc docker compose up -d --build
# KHÔNG cần .env. Chỉ tạo .env (chép từ .env.example) khi muốn đổi cổng, bật SePay / email.
# KHÔNG dùng "docker compose down -v": -v xóa toàn bộ dữ liệu.

# Tên cố định: xóa thư mục, tải lại, đổi tên thư mục vẫn dùng đúng dữ liệu cũ
name: costumehub

services:
  db:
    image: postgres:16-alpine
    container_name: costumehub_db
    restart: always
    # Không nghe cổng mạng nào: chỉ web và backup kết nối qua socket dùng chung, nên không có mật khẩu để mất
    command: ["postgres", "-c", "listen_addresses="]
    environment:
      POSTGRES_DB: costumehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chi-ket-noi-qua-socket}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
    healthcheck:
      # PID 1 = Postgres chính thức, không phải bản tạm lúc khởi tạo CSDL lần đầu
      test: ["CMD-SHELL", "[ \"$$(head -n 1 /var/lib/postgresql/data/postmaster.pid)\" = 1 ] && pg_isready -U postgres -d costumehub"]
      interval: 3s
      timeout: 5s
      retries: 30

  web:
    build: .
    container_name: costumehub_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Ho_Chi_Minh
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-3001}}
      DB_DIALECT: postgres
      DB_HOST: /var/run/postgresql
      DB_PORT: 5432
      DB_NAME: costumehub
      DB_USER: postgres
    ports:
      # Mặc định chỉ máy này truy cập được. Cho máy khác trong mạng: APP_BIND=0.0.0.0 trong .env
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3001}:3000"
    volumes:
      # Giữ file upload khi xóa / build lại container
      - uploads:/app/public/uploads          # ảnh trang phục (công khai)
      - private_uploads:/app/private_uploads # ảnh CCCD + ảnh tình trạng đồ (riêng tư)
      - appstate:/app/state                  # khóa phiên tự sinh
      - pgsocket:/var/run/postgresql

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: costumehub_backup
    restart: always
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy           # web tạo bảng xong mới sao lưu
    environment:
      TZ: Asia/Ho_Chi_Minh
      PGHOST: /var/run/postgresql
      PGUSER: postgres
      PGDATABASE: costumehub
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["sh", "/scripts/backup.sh"]
    volumes:
      # Lấy bản sao lưu ra máy:  docker compose cp backup:/backups ./backups
      - backups:/backups
      - pgsocket:/var/run/postgresql
      - uploads:/data/uploads:ro
      - private_uploads:/data/private:ro
      - backupdata:/var/lib/postgresql/data  # image postgres tự khai volume này: đặt tên để không sinh volume rác

volumes:
  pgdata:
  pgsocket:
  uploads:
  private_uploads:
  appstate:
  backups:
  backupdata:
